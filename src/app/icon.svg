<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!--
    Фавикон: гранёная «М» из логотипа заказчика. В шапке логотип шрифтовой,
    а знак живёт здесь — в мелком квадрате он читается лучше надписи.
    Огранка сведена к двум плоскостям: на 16 пикселях мелкая сетка
    превращается в кашу.
  -->
  <defs>
    <linearGradient id="a" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#35c2f5"/>
      <stop offset="100%" stop-color="#1b75bc"/>
    </linearGradient>
    <clipPath id="m">
      <path d="M20 21 H65 L100 86 L135 21 H180 V161 L162.5 179 L145 161 V79 L100 136 L55 79 V161 L37.5 179 L20 161 Z"/>
    </clipPath>
  </defs>

  <rect width="200" height="200" fill="#0b1028"/>

  <g clip-path="url(#m)">
    <rect width="200" height="200" fill="url(#a)"/>
    <!-- Одна грань поверх: даёт объём и не мешает силуэту на мелком размере. -->
    <polygon points="0,0 200,0 0,200" fill="#0b1028" opacity="0.28"/>
  </g>
</svg>
